<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的文献库 · 基因组雷达</title><link rel="stylesheet" href="assets/library.css"><script defer src="assets/library-store.js"></script><script defer src="assets/library.js"></script></head><body>
<header><a class="brand" href="index.html">基因组雷达 <small>GENOME RADAR</small></a><nav aria-label="主导航"><a href="index.html">首页</a><a href="index.html#archive">文献归档</a><a href="search.html">文献搜索</a><a href="library.html" aria-current="page">我的文献库</a></nav></header>
<main><section class="intro"><p>PERSONAL READING LIBRARY</p><h1>我的文献库</h1><span>管理收藏、阅读状态与研究笔记</span></section><p id="message" role="status" aria-live="polite"></p><div class="stats" id="stats"></div><div class="layout">
<aside><h2>专题清单</h2><div class="topic-add"><input id="topic-name" maxlength="80" placeholder="输入专题名称" aria-label="专题名称"><button id="topic-add">新建</button></div><div id="topics"></div><h2>数据管理</h2><p>数据保存在当前浏览器。导出备份可用于转移或恢复。</p><button id="export">导出 JSON</button><label class="button" for="import">导入 JSON</label><input id="import" type="file" accept="application/json,.json" hidden><label for="import-mode">导入方式</label><select id="import-mode"><option value="merge">合并</option><option value="replace">替换</option></select></aside>
<section class="results"><div class="filters"><input id="query" type="search" placeholder="搜索标题、DOI、专题或笔记" aria-label="搜索文献"><select id="star-filter" aria-label="收藏状态"><option value="all">全部收藏状态</option><option value="starred">已收藏</option><option value="unstarred">未收藏</option></select><select id="status-filter" aria-label="阅读状态"><option value="all">全部阅读状态</option><option value="unread">未开始</option><option value="to_read">待精读</option><option value="read">已读</option></select><select id="topic-filter" aria-label="专题筛选"><option value="">全部专题</option></select><select id="sort" aria-label="排序"><option value="created">按收藏时间</option><option value="modified">按最近修改</option><option value="publication_date">按发表时间</option></select></div><p id="count"></p><p id="unmatched" role="status"></p><div id="list"></div></section>
<aside class="editor"><h2>研究笔记</h2><p id="selected">选择一篇文献以编辑笔记</p><label for="note">笔记内容</label><textarea id="note" rows="12" disabled></textarea><div class="actions"><button id="save-note" disabled>保存笔记</button><button id="clear-note" disabled>删除笔记</button></div><h2>加入专题</h2><div id="assign">请选择文献</div></aside>
</div></main></body></html>
