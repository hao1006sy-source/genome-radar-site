<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人科研专刊归档 - 基因组雷达</title>
  <link rel="stylesheet" href="../assets/common.css">
  <link rel="stylesheet" href="../assets/weekly.css">
  <link rel="stylesheet" href="../assets/site-nav.css">
  <style>
    body { background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; color: #2c3e50; }
    .page-container { max-width: 1440px; margin: 0 auto; padding: 24px 32px; box-sizing: border-box; }
    .hero { background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; padding: 36px 40px; margin-bottom: 24px; }
    .title { font-size: 28px; font-weight: 800; color: #1a252f; margin: 0 0 8px; }
    .desc { font-size: 15px; color: #64748b; line-height: 1.6; margin: 0; }
    .supp-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .supp-title { font-size: 18px; font-weight: 700; color: #1e293b; text-decoration: none; }
    .supp-title:hover { color: #0284c7; }
    .supp-meta { font-size: 13px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="page-container">
    <div style="margin-bottom: 16px;">
      <a href="../my-radar.html" style="color:#0284c7;text-decoration:none;font-weight:600;font-size:14px;">← 返回我的科研雷达</a>
    </div>
    <header class="hero">
      <div style="display:inline-block;padding:3px 10px;border-radius:4px;background:#1abc9c;color:#fff;font-size:12px;font-weight:700;margin-bottom:10px;">个人科研专刊归档</div>
      <h1 class="title">历史文献发现专刊归档</h1>
      <p class="desc">基于您个性化科研画像动态挖掘的学术经典与突破成果专刊列表，独立于每周公共周报。</p>
    </header>

    <div id="supplement-list">
      <!-- Loaded dynamically from assets/data/supplement-index.json -->
    </div>
  </div>

  <script src="../assets/site-nav.js"></script>
  <script>
    (async function(){
      try {
        var res = await fetch('../assets/data/supplement-index.json');
        var data = await res.json();
        var supps = data.supplements || [];
        var container = document.getElementById('supplement-list');
        if (!supps.length) {
          container.innerHTML = '<p style="color:#64748b;padding:20px;background:#fff;border-radius:8px;">暂无已发布的个人科研专刊，请前往【我的科研雷达】运行发现。</p>';
          return;
        }
        var html = supps.map(function(s){
          return [
            '<div class="supp-card">',
            '  <div>',
            '    <a class="supp-title" href="' + s.date + '/index.html">' + (s.title || ('专刊 (' + s.date + ')')) + '</a>',
            '    <div class="supp-meta">收录篇数: ' + (s.article_count || 0) + ' 篇 · 发布日期: ' + s.date + ' · 关注方向: ' + (s.profile_identity || '植物基因组学') + '</div>',
            '  </div>',
            '  <div>',
            '    <a href="' + s.date + '/index.html" class="btn-radar btn-primary" style="display:inline-block;padding:8px 18px;border-radius:6px;background:#173e2d;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">阅读专刊 ➔</a>',
            '  </div>',
            '</div>'
          ].join('');
        }).join('');
        container.innerHTML = html;
      } catch(e) {
        console.error('加载专刊归档失败:', e);
      }
    })();
  </script>
</body>
</html>
